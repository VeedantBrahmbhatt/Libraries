[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "libraries-data"
version = "0.1.0"
description = "Reproducible DOAB metadata preparation for the Libraries prototype"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "huggingface-hub>=0.28,<2",
  "pyarrow>=18,<24",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.8,<1"]

[project.scripts]
libraries-prepare = "libraries_data.prepare:main"
libraries-publish = "libraries_data.publish:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
